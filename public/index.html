<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ninety Wash</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --main-green: #00b900; --bg-color: #f5f5f5; --text-color: #333; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: var(--text-color); }
        .card { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; }
        #dashboardMode, #processMode { display: none; }
        h2 { margin: 0 0 15px 0; font-weight: 600; color: var(--main-green); }
        .point-box { background-color: var(--main-green); color: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 8px rgba(0,185,0,0.2); }
        .point-val { font-size: 2.5rem; font-weight: bold; line-height: 1.2; }
        .rate-badge { background-color: #f0fdf0; color: #555; padding: 5px 15px; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-bottom: 20px; border: 1px solid #ddefdd; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .manual-input { flex: 2; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1.1rem; text-align: center; outline: none; }
        .btn-confirm { flex: 1; background-color: var(--main-green); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .btn-quick { background: white; border: 2px solid var(--main-green); color: var(--main-green); padding: 15px 0; border-radius: 12px; font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-quick:active { background-color: var(--main-green); color: white; transform: scale(0.95); }
        .error-msg { color: #ff4b4b; font-size: 0.9rem; margin-top: 15px; min-height: 20px; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--main-green); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #cameraOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #cameraVideoWrapper {
            width: 90%;
            max-width: 360px;
            max-height: 65vh;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
        }
        #cameraOverlay video {
            width: 100%;
            display: block;
        }
        #cameraOverlay canvas { display: none; }
        .camera-label {
            color: white;
            font-size: 1rem;
            margin-bottom: 16px;
        }
        .btn-cancel-scan {
            margin-top: 20px;
            background: #555;
            color: white;
            border: none;
            padding: 12px 36px;
            border-radius: 20px;
            font-size: 1rem;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="dashboardMode" class="card">
        <h2>Ninety Wash</h2>
        <div class="point-box">
            <div style="font-size: 0.9rem; opacity: 0.9;">ยอดแต้มปัจจุบัน</div>
            <div class="point-val" id="userPoints">...</div>
        </div>
        <div class="rate-badge">💡 1 แต้ม = 1 บาท</div>
        <div class="input-group">
            <input type="number" id="manualAmount" class="manual-input" placeholder="ระบุเอง">
            <button class="btn-confirm" onclick="handleManual()">ยืนยัน</button>
        </div>
        <div class="grid-container">
            <button class="btn-quick" onclick="checkAndScan(20)">20</button>
            <button class="btn-quick" onclick="checkAndScan(30)">30</button>
            <button class="btn-quick" onclick="checkAndScan(40)">40</button>
            <button class="btn-quick" onclick="checkAndScan(50)">50</button>
            <button class="btn-quick" onclick="checkAndScan(60)">60</button>
            <button class="btn-quick" onclick="checkAndScan(70)">70</button>
            <button class="btn-quick" onclick="checkAndScan(80)">80</button>
            <button class="btn-quick" onclick="checkAndScan(90)">90</button>
            <button class="btn-quick" onclick="checkAndScan(100)">100</button>
        </div>
        <div id="errorDisplay" class="error-msg"></div>
    </div>

    <div id="processMode" class="card">
        <h2>สถานะรายการ</h2>
        <div style="font-size:3.5rem; margin:20px 0;" id="statusIcon">⏳</div>
        <p id="statusText">กำลังตรวจสอบข้อมูล...</p>
        <button onclick="liff.closeWindow()" style="background:#555; color:white; border:none; padding:10px 30px; border-radius:20px; margin-top:20px;">ปิดหน้าต่าง</button>
    </div>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText" style="margin-top:15px; font-weight:bold; color:var(--main-green);">กำลังประมวลผล...</p>
    </div>

    <div id="cameraOverlay">
        <div class="camera-label">จ่อกล้องไปที่ QR บนเครื่อง</div>
        <div id="cameraVideoWrapper">
            <video id="cameraVideo" autoplay playsinline muted></video>
        </div>
        <canvas id="cameraCanvas"></canvas>
        <button class="btn-cancel-scan" onclick="stopCamera()">ยกเลิก</button>
    </div>

<script>
    const LIFF_ID = "2009026941-FsGWN6uS";
    let currentPoints = 0;
    let userId = "";
    let cameraStream = null;
    let scanAnimFrame = null;
    let pendingAmount = 0;

    async function main() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            const profile = await liff.getProfile();
            userId = profile.userId;

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (token) {
                document.getElementById('processMode').style.display = 'block';
                await handleReceivePoints(token);
            } else {
                document.getElementById('dashboardMode').style.display = 'block';
                await fetchPoints();
            }
        } catch (err) {
            document.getElementById('errorDisplay').innerText = "Init Error: " + err.message;
        }
    }

    async function fetchPoints() {
        try {
            const res = await axios.get(`/api/get-user-points?userId=${userId}`);
            currentPoints = parseInt(res.data.points) || 0;
            document.getElementById('userPoints').innerText = currentPoints;
        } catch (err) {
            document.getElementById('errorDisplay').innerText = "ขออภัย โหลดแต้มไม่สำเร็จค่ะ 🧸";
        }
    }

    async function checkAndScan(amount) {
        if (amount > currentPoints) {
            document.getElementById('errorDisplay').innerText = `แต้มไม่พอ! (ขาด ${amount - currentPoints} แต้ม) 🧸`;
            return;
        }
        document.getElementById('errorDisplay').innerText = "";
        pendingAmount = amount;
        try {
            const result = await liff.scanCodeV2();
            if (result && result.value) handleQRResult(result.value);
        } catch (e) {
            startCamera();
        }
    }

    function startCamera() {
        const overlay = document.getElementById('cameraOverlay');
        overlay.style.display = 'flex';
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                cameraStream = stream;
                const video = document.getElementById('cameraVideo');
                video.srcObject = stream;
                video.onloadedmetadata = () => { video.play(); scanFrame(); };
            })
            .catch(err => {
                stopCamera();
                document.getElementById('errorDisplay').innerText = "เปิดกล้องไม่ได้: " + err.message;
            });
    }

    function scanFrame() {
        const video = document.getElementById('cameraVideo');
        const canvas = document.getElementById('cameraCanvas');
        if (!cameraStream) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code && code.data) {
                stopCamera();
                handleQRResult(code.data);
                return;
            }
        }
        scanAnimFrame = requestAnimationFrame(scanFrame);
    }

    function stopCamera() {
        if (scanAnimFrame) { cancelAnimationFrame(scanAnimFrame); scanAnimFrame = null; }
        if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
        document.getElementById('cameraOverlay').style.display = 'none';
    }

    function handleQRResult(value) {
        let machineId = value.trim().toUpperCase();
        if (machineId.includes("MACHINE_ID=")) {
            machineId = machineId.split("MACHINE_ID=")[1].split("&")[0];
        }
        executeRedeem(pendingAmount, machineId);
    }

    async function executeRedeem(amount, machineId) {
        showLoading(true, `กำลังสั่งงานเครื่อง ${machineId}... 🧼`);
        try {
            await axios.get(`/liff/redeem-execute?userId=${userId}&amount=${amount}&machine_id=${machineId}`);
            showLoading(false);
            alert(`✅ ส่งคำสั่งไปที่เครื่อง ${machineId} แล้วค่ะ!\nกรุณารอสักครู่เพื่อให้เครื่องเริ่มทำงาน 🧸✨`);
            liff.closeWindow();
        } catch (err) {
            showLoading(false);
            alert("❌ ผิดพลาด: " + (err.response?.data || err.message));
            fetchPoints();
        }
    }

    async function handleReceivePoints(token) {
        try {
            await axios.get(`/liff/consume?token=${token}&userId=${userId}`);
            document.getElementById('statusIcon').innerText = "✅";
            document.getElementById('statusText').innerText = "สะสมแต้มสำเร็จแล้วค่ะ! ✨🧼";
        } catch (err) {
            document.getElementById('statusIcon').innerText = "❌";
            document.getElementById('statusText').innerText = "รับแต้มไม่สำเร็จ หรือ QR หมดอายุค่ะ 🧸";
        }
    }

    function handleManual() {
        const val = document.getElementById('manualAmount').value;
        if (val) checkAndScan(parseInt(val));
    }
    function showLoading(isShow, text = "") {
        const overlay = document.getElementById('loadingOverlay');
        document.getElementById('loadingText').innerText = text;
        overlay.style.display = isShow ? 'flex' : 'none';
    }

    main();
</script>
</body>
</html>
