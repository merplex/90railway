<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>สแกน QR สะสมแต้ม</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: 'Helvetica Neue', sans-serif;
            color: #333;
        }
        .icon { font-size: 60px; margin-bottom: 16px; }
        .msg { font-size: 16px; color: #666; }
        .err { color: #ff4b4b; font-size: 14px; margin-top: 12px; text-align: center; padding: 0 24px; }
    </style>
</head>
<body>
    <div class="icon">📷</div>
    <div class="msg">กำลังเปิดกล้อง...</div>
    <div class="err" id="errMsg"></div>

    <script>
        liff.init({ liffId: "2009026941-ATykVU9X" }).then(() => {
            if (!liff.isInClient()) {
                document.getElementById("errMsg").textContent = "กรุณาเปิดในแอป LINE เท่านั้น";
                return;
            }
            return liff.scanCodeV2();
        }).then((result) => {
            if (result && result.value) {
                window.location.href = result.value;
            }
        }).catch((err) => {
            document.getElementById("errMsg").textContent = "ไม่สามารถเปิดกล้องได้: " + err.message;
        });
    </script>
</body>
</html>
