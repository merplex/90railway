<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>สแกน QR สะสมแต้ม</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: 'Helvetica Neue', sans-serif;
            color: #333;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .icon { font-size: 64px; margin-bottom: 12px; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .sub { font-size: 14px; color: #888; margin-bottom: 32px; }
        .btn {
            background: #00b900;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,185,0,0.3);
        }
        .btn:disabled { background: #ccc; box-shadow: none; cursor: default; }
        .result { margin-top: 24px; font-size: 16px; font-weight: bold; }
        .result.ok { color: #00b900; }
        .result.err { color: #ff4b4b; font-size: 13px; font-weight: normal; }
    </style>
</head>
<body>
    <div class="icon" id="icon">📷</div>
    <div class="title">สะสมแต้ม</div>
    <div class="sub">กดปุ่มด้านล่างแล้วสแกน QR ที่หน้าเครื่อง</div>
    <button class="btn" id="scanBtn" onclick="startScan()" disabled>กำลังโหลด...</button>
    <div class="result" id="result"></div>

    <script>
        var userId = null;

        liff.init({ liffId: "2009026941-ATykVU9X" }).then(() => {
            var btn = document.getElementById("scanBtn");
            if (!liff.isInClient()) {
                document.getElementById("result").className = "result err";
                document.getElementById("result").textContent = "กรุณาเปิดในแอป LINE เท่านั้น";
                return;
            }
            return liff.getProfile();
        }).then((profile) => {
            if (profile) {
                userId = profile.userId;
                var btn = document.getElementById("scanBtn");
                btn.disabled = false;
                btn.textContent = "เปิดกล้องสแกน";
            }
        }).catch((err) => {
            document.getElementById("result").className = "result err";
            document.getElementById("result").textContent = "Error: " + (err.code || "") + " " + (err.message || String(err));
        });

        function startScan() {
            var btn = document.getElementById("scanBtn");
            var resultEl = document.getElementById("result");
            btn.disabled = true;
            btn.textContent = "กำลังเปิดกล้อง...";
            resultEl.textContent = "";
            resultEl.className = "result";

            liff.scanCodeV2().then((res) => {
                if (!res || !res.value) {
                    btn.disabled = false;
                    btn.textContent = "เปิดกล้องสแกน";
                    return;
                }
                // ดึง token จาก URL ที่สแกนได้
                var token = null;
                try {
                    var url = new URL(res.value);
                    token = url.searchParams.get("token");
                } catch(e) {}

                if (!token) {
                    resultEl.className = "result err";
                    resultEl.textContent = "QR นี้ไม่ใช่ของระบบ";
                    btn.disabled = false;
                    btn.textContent = "เปิดกล้องสแกน";
                    return;
                }

                btn.textContent = "กำลังบันทึกแต้ม...";
                return fetch("/liff/consume?token=" + token + "&userId=" + userId);
            }).then((fetchRes) => {
                if (!fetchRes) return;
                return fetchRes.text();
            }).then((text) => {
                if (!text) return;
                if (text === "SUCCESS") {
                    document.getElementById("icon").textContent = "✅";
                    resultEl.className = "result ok";
                    resultEl.textContent = "สะสมแต้มสำเร็จแล้ว!";
                } else {
                    resultEl.className = "result err";
                    resultEl.textContent = "ไม่สำเร็จ: " + text;
                }
                btn.disabled = false;
                btn.textContent = "สแกนอีกครั้ง";
                document.getElementById("icon").textContent = "📷";
            }).catch((err) => {
                resultEl.className = "result err";
                resultEl.textContent = "เกิดข้อผิดพลาด กรุณาลองใหม่";
                btn.disabled = false;
                btn.textContent = "เปิดกล้องสแกน";
            });
        }
    </script>
</body>
</html>
