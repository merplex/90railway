<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>สแกน QR สะสมแต้ม</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Helvetica Neue', sans-serif; }
        #video { width: 100%; max-width: 480px; display: block; }
        canvas { display: none; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; padding: 24px;
        }
        .frame {
            width: 240px; height: 240px;
            border: 3px solid #00b900;
            border-radius: 16px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
            margin-bottom: 24px;
        }
        .label { font-size: 15px; color: #ddd; }
        #statusMsg { margin-top: 16px; font-size: 14px; color: #00e600; min-height: 20px; }
        #startBtn {
            background: #00b900; color: white; border: none;
            padding: 14px 40px; border-radius: 12px; font-size: 17px; font-weight: bold;
            cursor: pointer; margin-top: 16px;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="overlay">
        <div class="frame" id="frame" style="display:none"></div>
        <div class="label" id="label">กดปุ่มเพื่อเปิดกล้องสแกน QR</div>
        <div id="statusMsg"></div>
        <button id="startBtn" onclick="startCamera()">เปิดกล้อง</button>
    </div>

    <script>
        var scanning = false;
        var stream = null;

        function startCamera() {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("statusMsg").textContent = "กำลังเปิดกล้อง...";

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                .then(function(s) {
                    stream = s;
                    var video = document.getElementById("video");
                    video.srcObject = s;
                    video.play();
                    document.getElementById("frame").style.display = "block";
                    document.getElementById("label").textContent = "จ่อ QR ที่หน้าเครื่องให้อยู่ในกรอบ";
                    document.getElementById("statusMsg").textContent = "";
                    scanning = true;
                    requestAnimationFrame(tick);
                })
                .catch(function(err) {
                    document.getElementById("statusMsg").textContent = "เปิดกล้องไม่ได้: " + err.message;
                    document.getElementById("startBtn").style.display = "block";
                });
        }

        function tick() {
            if (!scanning) return;
            var video = document.getElementById("video");
            var canvas = document.getElementById("canvas");
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(tick);
                return;
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code && code.data) {
                scanning = false;
                if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
                document.getElementById("frame").style.borderColor = "#fff";
                document.getElementById("label").textContent = "สแกนสำเร็จ! กำลังโหลด...";
                document.getElementById("statusMsg").textContent = "";
                window.location.href = code.data;
            } else {
                requestAnimationFrame(tick);
            }
        }
    </script>
</body>
</html>
