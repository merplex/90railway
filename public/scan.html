<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>สแกน QR สะสมแต้ม</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: 'Helvetica Neue', sans-serif;
            color: #333;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .icon { font-size: 64px; margin-bottom: 12px; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .sub { font-size: 14px; color: #888; margin-bottom: 32px; }
        .btn {
            background: #00b900;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,185,0,0.3);
        }
        .btn:disabled { background: #ccc; box-shadow: none; cursor: default; }
        .result { margin-top: 24px; font-size: 16px; font-weight: bold; }
        .result.ok { color: #00b900; }
        .result.err { color: #ff4b4b; font-size: 13px; font-weight: normal; }
    </style>
</head>
<body>
    <div class="icon" id="icon">📷</div>
    <div class="title">สะสมแต้ม</div>
    <div class="sub">กดปุ่มด้านล่างแล้วสแกน QR ที่หน้าเครื่อง</div>
    <button class="btn" id="scanBtn" onclick="startScan()" disabled>กำลังโหลด...</button>
    <div class="result" id="result"></div>

    <script>
        var userId = null;

        async function initLiff() {
            try {
                await liff.init({ liffId: "2009026941-ATykVU9X" });
                if (!liff.isInClient()) {
                    showErr("กรุณาเปิดในแอป LINE เท่านั้น");
                    return;
                }
                var idToken = liff.getDecodedIDToken();
                userId = idToken && idToken.sub ? idToken.sub : null;
                if (!userId) {
                    var profile = await liff.getProfile();
                    userId = profile.userId;
                }
                var btn = document.getElementById("scanBtn");
                btn.disabled = false;
                btn.textContent = "เปิดกล้องสแกน";
            } catch (e) {
                showErr("โหลดไม่สำเร็จ: " + (e.message || String(e)));
            }
        }

        async function startScan() {
            var btn = document.getElementById("scanBtn");
            var resultEl = document.getElementById("result");
            btn.disabled = true;
            btn.textContent = "กำลังเปิดกล้อง...";
            resultEl.textContent = "";
            resultEl.className = "result";

            try {
                var res = await (liff.scanCode ? liff.scanCode() : liff.scanCodeV2());
                if (!res || !res.value) {
                    btn.disabled = false;
                    btn.textContent = "เปิดกล้องสแกน";
                    return;
                }
                var token = null;
                try {
                    token = new URL(res.value).searchParams.get("token");
                } catch(e) {}

                if (!token) {
                    showErr("QR นี้ไม่ใช่ของระบบ");
                    btn.disabled = false;
                    btn.textContent = "เปิดกล้องสแกน";
                    return;
                }

                btn.textContent = "กำลังบันทึกแต้ม...";
                var fetchRes = await fetch("/liff/consume?token=" + token + "&userId=" + userId);
                var text = await fetchRes.text();

                if (text === "SUCCESS") {
                    document.getElementById("icon").textContent = "✅";
                    showOk("สะสมแต้มสำเร็จแล้ว!");
                } else {
                    showErr("ไม่สำเร็จ: " + text);
                }
                btn.disabled = false;
                btn.textContent = "สแกนอีกครั้ง";
            } catch (e) {
                if (e.message !== "User cancelled") {
                    showErr("เกิดข้อผิดพลาด: " + e.message);
                }
                btn.disabled = false;
                btn.textContent = "เปิดกล้องสแกน";
            }
        }

        function showOk(msg) {
            var el = document.getElementById("result");
            el.className = "result ok";
            el.textContent = msg;
        }
        function showErr(msg) {
            var el = document.getElementById("result");
            el.className = "result err";
            el.textContent = msg;
        }

        initLiff();
    </script>
</body>
</html>
